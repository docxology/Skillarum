[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillarum"
description = "Scrape selected website pages, render portable agent skills, and evaluate provenance"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "beautifulsoup4>=4.13",
    "httpx>=0.28",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
llm = ["openai>=2.0"]
research = ["matplotlib>=3.10"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=7.0",
    "coverage[toml]>=7.15",
    "ruff>=0.15",
]

[project.scripts]
skillarum = "skillarum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "skillarum.__version__" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
patch = ["subprocess"]
omit = ["*/__init__.py", "*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "pytest-httpserver>=1.1.5",
]
